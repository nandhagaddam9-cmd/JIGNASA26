version: '3.8'

services:
  dashboard:
    build: .
    container_name: retail_assistant_dashboard
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  api:
    build: .
    container_name: retail_assistant_api
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    volumes:
      - ./data:/app/data
